name: tests

on:
  push:
    branches: [main, quality-engineering]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-quality.txt

      # No GROQ_API_KEY here on purpose: this run uses no real AI calls,
      # so it is free, fast and gives the same result every time.
      - name: Run tests
        run: |
          mkdir -p reports
          pytest -v --html=reports/report.html --self-contained-html

      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/report.html

  ui-browser:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
            requirements-ui.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-quality.txt -r requirements-ui.txt

      - name: Install the browser
        run: playwright install --with-deps chromium

      # The app runs with fake AI answers (tests/ui/fake_app.py): no key, no cost.
      - name: Run browser tests
        run: pytest tests/ui/test_ui_browser.py -v

      - name: Save screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: reports/ui
          if-no-files-found: ignore